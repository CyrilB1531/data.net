version: 2

# Actions are pinned to full commit SHAs so a moved tag cannot change what runs
# in CI. That only stays safe if the pins are actually maintained — Dependabot
# understands SHA pins and refreshes both the SHA and its version comment.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      # One PR for routine bumps rather than one per action — but minor and patch
      # only. Majors are the updates that can change behaviour, so they arrive
      # individually and can be judged on their own merits. Grouping them means a
      # six-action block that can only be taken or refused whole, and two of the
      # four workflows are tag/dispatch-triggered, so no pull request exercises
      # them: an unreviewed major there surfaces at publish time.
      actions:
        patterns: ['*']
        update-types: [minor, patch]
