name: Release

# Publishes the NuGet packages to GitHub Packages when a version tag is pushed,
# e.g.:  git tag v0.1.0 && git push origin v0.1.0
#
# GitHub Packages authenticates with the automatic GITHUB_TOKEN — no nuget.org
# account and no manually-created API key are required.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test --configuration Release

      # Derived from the tag name, which GitHub's own guidance treats as
      # untrusted. Same reasoning as release-nuget-org.yml: keep it as data.
      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          for proj in src/DataNet.Text src/DataNet.Embeddings src/DataNet.Fuzzy; do
            dotnet pack "$proj" --configuration Release -o artifacts \
              -p:Version="$VERSION"
          done

      - name: Push to GitHub Packages
        env:
          OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source "https://nuget.pkg.github.com/$OWNER/index.json" \
            --api-key "$GITHUB_TOKEN" \
            --skip-duplicate

      - name: Upload packages as build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
