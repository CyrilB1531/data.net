name: Release

# Publishes the NuGet packages to GitHub Packages when a version tag is pushed,
# e.g.:  git tag v0.1.0 && git push origin v0.1.0
#
# GitHub Packages authenticates with the automatic GITHUB_TOKEN — no nuget.org
# account and no manually-created API key are required.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test --configuration Release

      # Derived from the tag name, which GitHub's own guidance treats as
      # untrusted. Same reasoning as release-nuget-org.yml: keep it as data.
      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          for proj in src/DataNet.Text src/DataNet.Embeddings src/DataNet.Fuzzy; do
            dotnet pack "$proj" --configuration Release -o artifacts \
              -p:Version="$VERSION"
          done

      - name: Push to GitHub Packages
        env:
          OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source "https://nuget.pkg.github.com/$OWNER/index.json" \
            --api-key "$GITHUB_TOKEN" \
            --skip-duplicate

      - name: Upload packages as build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
