name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (markdown + C# format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Markdown lint
        run: npx --yes markdownlint-cli2 "README.md" "docs/**/*.md" "tools/README.md" "bench/README.md"
      - name: C# format check
        run: dotnet format DataNet.slnx --verify-no-changes

  build-test:
    name: Build, test, pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test (with coverage)
        run: >
          dotnet test --configuration Release --no-build
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"

      - name: Pack
        run: |
          for proj in src/DataNet.Text src/DataNet.Embeddings src/DataNet.Fuzzy; do
            dotnet pack "$proj" --configuration Release --no-build --output ./artifacts
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: ./artifacts/*.nupkg

  oracles-fresh:
    name: Oracles are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate oracles and check for drift
        run: |
          pip install -r tools/requirements.txt
          python tools/generate_oracles.py
          if ! git diff --quiet -- tests/oracles; then
            echo "::error::Committed oracle corpora differ from a fresh generation. Run tools/generate_oracles.py and commit the result."
            git --no-pager diff --stat -- tests/oracles
            exit 1
          fi
