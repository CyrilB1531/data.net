name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (markdown + C# format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Markdown lint
        # Pinned and --ignore-scripts: `npx --yes <name>` resolves the latest
        # version on demand and runs its lifecycle scripts, so the code executed
        # in CI could change with no commit here.
        run: >
          npx --yes --ignore-scripts markdownlint-cli2@0.23.2
          "README.md" "CONTRIBUTING.md" "docs/**/*.md" "tools/README.md" "bench/README.md"
      - name: C# format check
        run: dotnet format DataNet.slnx --verify-no-changes

  build-test:
    name: Build, test, pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test (with coverage)
        run: >
          dotnet test --configuration Release --no-build
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"

      - name: Pack
        run: |
          for proj in src/DataNet.Text src/DataNet.Embeddings src/DataNet.Fuzzy; do
            dotnet pack "$proj" --configuration Release --no-build --output ./artifacts
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: '**/*.trx'

      - name: Upload NuGet package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget
          path: ./artifacts/*.nupkg

  oracles-fresh:
    name: Oracles are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Regenerate oracles and check for drift
        run: |
          # --only-binary :all: refuses source distributions, so no setup.py from a
          # downloaded package executes. Verified that every pinned dependency
          # publishes wheels.
          pip install --only-binary :all: -r tools/requirements.txt
          python tools/generate_oracles.py
          if ! git diff --quiet -- tests/oracles; then
            echo "::error::Committed oracle corpora differ from a fresh generation. Run tools/generate_oracles.py and commit the result."
            git --no-pager diff --stat -- tests/oracles
            exit 1
          fi
