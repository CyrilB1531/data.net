name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (markdown + C# format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Markdown lint
        # Pinned and --ignore-scripts: `npx --yes <name>` resolves the latest
        # version on demand and runs its lifecycle scripts, so the code executed
        # in CI could change with no commit here.
        run: >
          npx --yes --ignore-scripts markdownlint-cli2@0.23.2
          "README.md" "CONTRIBUTING.md" "docs/**/*.md" "tools/README.md" "bench/README.md"
      - name: C# format check
        run: dotnet format DataNet.slnx --verify-no-changes

  build-test:
    name: Build, test, pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test (with coverage)
        run: >
          dotnet test --configuration Release --no-build
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"

      - name: Pack
        run: |
          for proj in src/DataNet.Text src/DataNet.Embeddings src/DataNet.Fuzzy; do
            dotnet pack "$proj" --configuration Release --no-build --output ./artifacts
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: '**/*.trx'

      - name: Upload NuGet package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget
          path: ./artifacts/*.nupkg

  oracles-fresh:
    name: Oracles are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Regenerate oracles and check for drift
        run: |
          # Install from the generated lock, not the human-edited input:
          #   --require-hashes    every artefact must match a recorded hash, which
          #                       also pins the transitive graph (nltk pulls regex,
          #                       scikit-learn pulls scipy, and so on)
          #   --only-binary :all: no source distribution, so no setup.py executes
          pip install --only-binary :all: --require-hashes -r tools/requirements.lock.txt
          python tools/generate_oracles.py
          if ! git diff --quiet -- tests/oracles; then
            echo "::error::Committed oracle corpora differ from a fresh generation. Run tools/generate_oracles.py and commit the result."
            git --no-pager diff --stat -- tests/oracles
            exit 1
          fi
