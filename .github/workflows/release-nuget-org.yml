name: Publish to nuget.org (Trusted Publishing)

# Keyless publishing to nuget.org — no API key stored anywhere. GitHub Actions
# exchanges a short-lived OIDC token for a temporary nuget.org key, authorized by
# a Trusted Publishing policy you configure once on nuget.org (see README).
#
# Run manually from the Actions tab once the policy is set up.

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - DataNet.Text
          - DataNet.Embeddings
          - DataNet.Fuzzy
      version:
        description: 'Version to publish (e.g. 0.2.1) — must match the declared one'
        required: true

permissions:
  id-token: write   # required for OIDC / Trusted Publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # The inputs are user-supplied. Passed through the environment they stay
      # data; interpolated into the script they would BE the script, in a job
      # that can mint a nuget.org publishing key.
      #
      # The version is a confirmation, not a setting: src/<Package>/Version.props
      # declares it, and a disagreement stops the job rather than silently
      # publishing a number the repository never claimed. Nothing user-supplied
      # reaches `dotnet pack`.
      - name: The input matches the declared version
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          declared=$(dotnet msbuild "src/$PACKAGE" -getProperty:Version -p:TargetFramework=net10.0)
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::Input says $VERSION, src/$PACKAGE declares $declared."
            exit 1
          fi
          echo "$PACKAGE $declared"

      - name: Test
        run: dotnet test --configuration Release

      - name: Pack
        env:
          PACKAGE: ${{ inputs.package }}
        run: dotnet pack "src/$PACKAGE" --configuration Release -o artifacts

      - name: The shipped dependency graph is the intended one
        run: python3 tools/check_nuspec_dependencies.py artifacts

      # Exchanges the OIDC token for a temporary nuget.org API key (no stored key).
      - name: NuGet trusted login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: CyrilB1531

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
