name: Publish to nuget.org (Trusted Publishing)

# Keyless publishing to nuget.org — no API key stored anywhere. GitHub Actions
# exchanges a short-lived OIDC token for a temporary nuget.org key, authorized by
# a Trusted Publishing policy you configure once on nuget.org (see README).
#
# Run manually from the Actions tab once the policy is set up.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0)'
        required: true

permissions:
  id-token: write   # required for OIDC / Trusted Publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test --configuration Release

      # The version is user-supplied. Passed through the environment it stays
      # data; interpolated into the script it would BE the script, in a job that
      # can mint a nuget.org publishing key.
      - name: Pack
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for proj in src/DataNet.Text src/DataNet.Embeddings src/DataNet.Fuzzy; do
            dotnet pack "$proj" --configuration Release -o artifacts -p:Version="$VERSION"
          done

      # Exchanges the OIDC token for a temporary nuget.org API key (no stored key).
      - name: NuGet trusted login
        id: login
        uses: NuGet/login@v1
        with:
          user: CyrilB1531

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
