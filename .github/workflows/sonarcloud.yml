name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze:
    name: Build and analyze
    runs-on: ubuntu-latest
    # SONAR_TOKEN reaches neither fork pull requests nor Dependabot: Dependabot
    # runs read from a separate secrets store, and its branches live in this
    # repository, so a fork-only guard lets them through to fail on an empty
    # token. A dependency bump changes no source, so skip rather than analyse.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 17
          distribution: 'zulu'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Shallow clones break blame, and with it new-code detection.
          fetch-depth: 0

      # The libraries target net10.0; the scanner analyses whatever the build
      # compiles, so the SDK has to be present before it runs.
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/scanner"
          dotnet tool update dotnet-sonarscanner --tool-path "${{ runner.temp }}/scanner"

      # begin -> build -> end: the scanner installs the Roslyn analyzers and
      # observes the compilation, so the build must happen between the two and
      # must not be skipped or served from cache — an incremental no-op build
      # produces an empty analysis that still reports success.
      - name: Build, test and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          "${{ runner.temp }}/scanner/dotnet-sonarscanner" begin \
            /k:"CyrilB1531_data.net" \
            /o:"cyrilb1531" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.python.version="3.12"

          dotnet build DataNet.slnx --configuration Release

          # Coverage must be written before `end` collects it. OpenCover, not the
          # default Cobertura: the .NET path of SonarQube Cloud reads OpenCover,
          # and a format or path mismatch fails silently as 0% coverage.
          dotnet test DataNet.slnx --configuration Release --no-build \
            --collect:"XPlat Code Coverage;Format=opencover"

          "${{ runner.temp }}/scanner/dotnet-sonarscanner" end /d:sonar.token="$SONAR_TOKEN"
