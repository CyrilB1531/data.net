name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze:
    name: Build and analyze
    runs-on: ubuntu-latest
    # SONAR_TOKEN reaches neither fork pull requests nor Dependabot: Dependabot
    # runs read from a separate secrets store, and its branches live in this
    # repository, so a fork-only guard lets them through to fail on an empty
    # token. A dependency bump changes no source, so skip rather than analyse.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 17
          distribution: 'zulu'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Shallow clones break blame, and with it new-code detection.
          fetch-depth: 0

      # The libraries target net10.0; the scanner analyses whatever the build
      # compiles, so the SDK has to be present before it runs.
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/scanner"
          dotnet tool update dotnet-sonarscanner --tool-path "${{ runner.temp }}/scanner"

      # begin -> build -> end: the scanner installs the Roslyn analyzers and
      # observes the compilation, so the build must happen between the two and
      # must not be skipped or served from cache — an incremental no-op build
      # produces an empty analysis that still reports success.
      #
      # *Every* compilation in the window is observed, not just the first, which
      # is what lets the samples be analysed without joining DataNet.slnx. They
      # must stay out of it: inside the solution they would resolve DataNet by
      # ProjectReference, and the packaging gate and the snippet check would both
      # become assertions about a graph that never ships (ADR 0009). Analysis
      # follows the build list, so before this they were read by nothing —
      # PackagingGate.cs landed with 0 issues reported, not because it is clean
      # but because no analyser had opened it.
      #
      # The scanner is no longer the only thing that reads them: since ADR 0019,
      # samples/Directory.Build.props carries SonarAnalyzer.CSharp and the samples
      # inherit the repository-wide .NET code-quality settings, so the samples
      # build below fails on a finding on its own. This window is still what puts
      # those findings in front of the quality gate.
      #
      # tools/ is excluded from *coverage* only, not from analysis: those scripts
      # are Python development utilities that generate data for the suite, so no
      # C# test will ever execute a line of them. Left in, they enter the quality
      # gate as new uncovered code and fail it on the day one of them is edited.
      # samples/ joins them for the same reason and a stronger one: the samples
      # have no tests and never will, because they *are* the test — the sample is
      # what proves the packages resolve, and the snippets are what proves the
      # guides compile. Analysed, never covered.
      #
      # samples/DataNet.DocSnippets/Generated/ is excluded from *analysis*: it is
      # extracted verbatim from the Markdown by tools/extract_doc_snippets.py, so
      # a finding there is a finding about prose the guides deliberately keep
      # short, and the file to fix it in would be a guide — where the rule usually
      # does not apply. The path is spelled out rather than written **/Generated/**
      # so that a generated directory added anywhere else has to opt out on
      # purpose instead of inheriting silence. The hand-written SnippetContext.cs
      # stays in.
      #
      # tests/oracles/ is excluded from *analysis*, which is the stronger form.
      # Two of the fixtures are binary — tiny_sp.model is a protobuf, first
      # undecodable byte at offset 54; tiny_encoder.onnx is an ONNX graph, offset
      # 3 — and the scanner indexes every unexcluded file and decodes it with
      # sonar.sourceEncoding, so each run logged "Invalid character encountered
      # ... for encoding UTF-8". Declaring an encoding is not the fix the warning
      # suggests it is: no encoding makes a protobuf text. The rest of the
      # directory is ~4.5 MB of generated JSON corpora, which are frozen
      # reference data rather than something to analyse.
      #
      # Both exclusion properties are set because a file is indexed as either
      # main or test source, and these belong to no project's compilation — they
      # are copied to output as `None Include=...`, so which bucket the MSBuild
      # integration puts them in is not worth a CI round-trip to discover.
      # Neither bucket has anything here to analyse.
      #
      # projectBaseDir is pinned because those two exclusions are *relative*: they
      # are matched against whatever directory the scanner decided was the base,
      # and Scanner for .NET warns that its auto-detection of that directory
      # already changed once between major versions. Left implicit, an upgrade
      # that moved the base would make the patterns match nothing and the
      # exclusions would fail open — silently, because the only symptom is a WARN,
      # and a WARN never fails a job. $GITHUB_WORKSPACE is the value auto-detection
      # resolves to today, so pinning it changes no file key and re-keys no issue.
      #
      # qualitygate.wait is what makes this job's colour mean something. Without
      # it `end` uploads the analysis and exits 0 whatever the gate says, so a
      # pull request that fails the gate reported a green "Build and analyze" and
      # nothing stopped it — the analysis was published and then ignored. With it,
      # `end` polls until the gate is computed and exits non-zero when it fails,
      # which is what the branch ruleset on main requires to pass. The cost is
      # waiting for the server: the poll gives up after sonar.qualitygate.timeout,
      # 300 seconds by default, and a timeout also fails the job.
      #
      # The gate is Sonar's own "Clean as You Code" definition, on *new* code, so
      # what it blocks is what this pull request introduced — not the backlog it
      # inherited.
      #
      # tools/tests/** is excluded rather than declared. SonarPython reads a
      # Python file it cannot see as test code as production code and says so:
      # "detected files that look like test code but 'sonar.tests' is not
      # configured". The property it asks for cannot be set here — SonarScanner
      # for .NET 9 and later derives sonar.sources and sonar.tests from the
      # MSBuild projects it wraps and ignores both if you pass them, and this
      # job installs the scanner with `dotnet tool update`, unpinned. So the
      # choice is between a permanent warning and not analysing the file. What
      # is lost is small and named: tools/tests holds one file, whose own
      # correctness is proven by running it in the Lint job, not by reading it.
      - name: Begin analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          "${{ runner.temp }}/scanner/dotnet-sonarscanner" begin \
            /k:"CyrilB1531_data.net" \
            /o:"cyrilb1531" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.python.version="3.12" \
            /d:sonar.projectBaseDir="$GITHUB_WORKSPACE" \
            /d:sonar.coverage.exclusions="tools/**,bench/**,samples/**" \
            /d:sonar.exclusions="tests/oracles/**,samples/DataNet.DocSnippets/Generated/**,tools/tests/**" \
            /d:sonar.test.exclusions="tests/oracles/**"

      - name: Build the solution
        run: dotnet build DataNet.slnx --configuration Release

      # --no-build: the projects were just compiled above, and that compilation is
      # the one the scanner observed. Packing without it would recompile src/ a
      # second time inside the same window, for nothing.
      - name: Pack
        run: |
          for proj in src/Lodestar.Text src/DataNet.Embeddings src/DataNet.Fuzzy src/DataNet.Metrics; do
            dotnet pack "$proj" --configuration Release --no-build --output ./artifacts
          done

      - name: Extract the guide snippets
        run: python3 tools/extract_doc_snippets.py

      # The samples restore DataNet from ./artifacts, and the builds above have
      # already pulled published DataNet packages into the default global folder
      # (src/ reaches DataNet.Text by PackageReference). The global folder is
      # consulted ahead of every source, so a published package sitting in it
      # wins whenever the two share a version — these two builds would then
      # analyse a consumer of what already shipped. Their own NUGET_PACKAGES is
      # what keeps them identical to the gates in ci.yml, which is the point:
      # analysing a build that diverges from the one being gated is worse than
      # not analysing at all. See docs/decisions/0009-sample-consumes-a-local-feed.md.
      - name: Build the samples
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/sample-packages
        run: |
          dotnet build samples/DataNet.Sample --configuration Release
          dotnet build samples/DataNet.DocSnippets --configuration Release

      # Coverage must be written before `end` collects it. OpenCover, not the
      # default Cobertura: the .NET path of SonarQube Cloud reads OpenCover, and
      # a format or path mismatch fails silently as 0% coverage.
      - name: Test with coverage
        run: |
          dotnet test DataNet.slnx --configuration Release --no-build \
            --collect:"XPlat Code Coverage;Format=opencover"

      - name: End analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          "${{ runner.temp }}/scanner/dotnet-sonarscanner" end /d:sonar.token="$SONAR_TOKEN"
